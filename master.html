<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a2028">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dream Garage — Мастер</title>
<link rel="manifest" href="manifest.json">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2028;
    --panel-2: #232b36;
    --border: #2d3642;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #3b82f6;
    --ok: #10b981;
    --warn: #f59e0b;
    --info: #6366f1;
    --err: #ef4444;
    --purple: #a855f7;
    --cyan: #06b6d4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 20px;
    -webkit-tap-highlight-color: transparent;
  }
  
  header {
    background: var(--panel);
    padding: 16px;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid var(--border);
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  h1 span { color: var(--accent); font-style: italic; }
  .master-select {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    max-width: 180px;
  }
  .sync-status {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 8px;
    background: var(--panel-2);
    margin-left: 8px;
  }
  .sync-status.connected { color: var(--ok); }
  .sync-status.disconnected { color: var(--err); }
  
  .tabs { display: flex; gap: 8px; }
  .tab {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .tab.active { background: var(--accent); color: white; border-color: var(--accent); }
  .tab .count {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    padding: 2px 6px;
    border-radius: 10px;
    font-size: 11px;
    margin-left: 4px;
  }
  
  .content { padding: 16px; }
  
  .order-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    border-left: 4px solid var(--border);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .order-card:active { transform: scale(0.98); }
  .order-card.queue { border-left-color: var(--info); }
  .order-card.in-progress { border-left-color: var(--warn); }
  .order-card.completed { border-left-color: var(--ok); }
  .order-card.repair { border-left-color: var(--cyan); }
  
  .order-header {
    display: flex;
    justify-content: space-between;
    align-items: start;
    margin-bottom: 12px;
  }
  .order-id { font-size: 12px; color: var(--muted); }
  .order-time { font-size: 12px; color: var(--muted); }
  
  .order-main { margin-bottom: 12px; }
  .order-car { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .order-client { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  .order-services { font-size: 13px; color: var(--text); line-height: 1.4; }
  .order-price-tag {
    display: inline-block;
    margin-top: 8px;
    padding: 3px 10px;
    background: rgba(59,130,246,0.15);
    color: var(--accent);
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
  }
  
  .order-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 8px;
  }
  .order-price { font-size: 16px; font-weight: 700; color: var(--accent); }
  .order-actions { display: flex; gap: 8px; }
  
  .deadline-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    font-family: 'Courier New', monospace;
    margin-left: 6px;
  }
  .deadline-badge.ok { background: rgba(16,185,129,0.2); color: var(--ok); }
  .deadline-badge.warn { background: rgba(245,158,11,0.2); color: var(--warn); }
  .deadline-badge.err { background: rgba(239,68,68,0.2); color: var(--err); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.6; } }
  
  .btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:active { opacity: 0.7; }
  .btn.small { padding: 8px 12px; font-size: 13px; }
  .btn.ok { background: var(--ok); }
  .btn.warn { background: var(--warn); }
  .btn.cyan { background: var(--cyan); }
  .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn.full { width: 100%; padding: 14px; font-size: 15px; font-weight: 600; }
  
  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .badge.queue { background: rgba(99,102,241,0.2); color: var(--info); }
  .badge.in-progress { background: rgba(245,158,11,0.2); color: var(--warn); }
  .badge.completed { background: rgba(16,185,129,0.2); color: var(--ok); }
  
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal.open { display: flex; }
  .modal-content {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    max-width: 400px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-content h3 { margin-bottom: 16px; font-size: 18px; }
  .detail-row { margin-bottom: 12px; }
  .detail-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .detail-value { font-size: 14px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 20px; }
  .modal-actions .btn { flex: 1; }
  
  .post-option {
    background: var(--panel-2);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .post-option:hover { border-color: var(--accent); }
  .post-option.selected { border-color: var(--accent); background: rgba(59,130,246,0.1); }
  .post-option.repair-zone { border-color: var(--cyan); }
  .post-option.repair-zone.selected { background: rgba(6,182,212,0.1); }
  .post-option-name { font-weight: 600; font-size: 14px; }
  .post-option-status { font-size: 12px; color: var(--muted); }
  .post-option-status.free { color: var(--ok); }
  
  .queue-info {
    background: rgba(99,102,241,0.1);
    border: 1px solid rgba(99,102,241,0.3);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--text);
  }
  .queue-info strong { color: var(--info); }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>🏎️ <span>Dream</span> Garage</h1>
    <div>
      <select class="master-select" id="masterSelect" onchange="changeMaster()">
        <option value="">Мастер...</option>
      </select>
      <span class="sync-status" id="syncStatus">⚪</span>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('queue', this)">
      Очередь <span class="count" id="queueCount">0</span>
    </div>
    <div class="tab" onclick="switchTab('mine', this)">
      Мои <span class="count" id="mineCount">0</span>
    </div>
    <div class="tab" onclick="switchTab('done', this)">
      Готово <span class="count" id="doneCount">0</span>
    </div>
  </div>
</header>

<div class="content" id="content"></div>

<!-- Модалка деталей -->
<div class="modal" id="detailModal">
  <div class="modal-content">
    <h3 id="modalTitle">Детали наряда</h3>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<!-- Модалка выбора подъёмника -->
<div class="modal" id="postSelectModal">
  <div class="modal-content">
    <h3>🔧 Выберите место для работы</h3>
    <div class="queue-info">
      Заказ: <strong id="pickCar"></strong><br>
      <span id="pickServices" style="font-size:12px; color:var(--muted);"></span>
    </div>
    <div id="postOptions"></div>
    <div class="modal-actions" style="margin-top:16px;">
      <button class="btn ghost" onclick="closePostSelect()">Отмена</button>
      <button class="btn ok" id="confirmPickBtn" onclick="confirmPick()" disabled>✓ Взять заказ</button>
    </div>
  </div>
</div>

<script>
// ===== ВАЖНО: Вставьте сюда свою конфигурацию Firebase =====
const firebaseConfig = {
  apiKey: "AIzaSyALbJZSZdfNqtc47gIcDp_DmEVcsTp2_Mw",
  authDomain: "dream-garage-4bff9.firebaseapp.com",
  databaseURL: "https://dream-garage-4bff9-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "dream-garage-4bff9",
  storageBucket: "dream-garage-4bff9.firebasestorage.app",
  messagingSenderId: "1043595691448",
  appId: "1:1043595691448:web:7bd610400cf41701e7b4d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const MASTER_KEY = 'dg_master_id';
const MASTER_NAME_KEY = 'dg_master_name';
let currentMaster = localStorage.getItem(MASTER_KEY) || '';
let currentMasterName = localStorage.getItem(MASTER_NAME_KEY) || '';
let currentTab = 'queue';
let allQueue = [];
let allOrders = [];
let allHistory = [];
let allPosts = [];
let allMasters = [];

// Для выбора подъёмника
let pickingOrderId = null;
let selectedPostId = null;
let isRepairZone = false;

// ===== Инициализация =====
function init() {
  const connectedRef = db.ref('.info/connected');
  connectedRef.on('value', (snap) => {
    const statusEl = document.getElementById('syncStatus');
    if (snap.val() === true) {
      statusEl.textContent = '🟢';
      statusEl.className = 'sync-status connected';
    } else {
      statusEl.textContent = '🔴';
      statusEl.className = 'sync-status disconnected';
    }
  });

  db.ref('masters').on('value', (snapshot) => {
    const data = snapshot.val();
    allMasters = data ? Object.values(data) : [];
    const select = document.getElementById('masterSelect');
    select.innerHTML = '<option value="">Мастер...</option>' +
      allMasters.map(m => `<option value="${m.id}" ${String(m.id) === String(currentMaster) ? 'selected' : ''}>${m.name}</option>`).join('');
    render();
  });

  db.ref('queue').on('value', (snapshot) => {
    const data = snapshot.val();
    allQueue = data ? Object.values(data).sort((a,b) => (a.createdAt||'').localeCompare(b.createdAt||'')) : [];
    render();
  });

  db.ref('orders').on('value', (snapshot) => {
    const data = snapshot.val();
    allOrders = data ? Object.values(data) : [];
    render();
  });

  db.ref('history').on('value', (snapshot) => {
    const data = snapshot.val();
    allHistory = data ? Object.values(data) : [];
    render();
  });

  db.ref('posts').on('value', (snapshot) => {
    const data = snapshot.val();
    allPosts = data ? Object.values(data) : [];
  });

  if (!currentMaster) {
    alert('Выберите мастера для начала работы');
  }
  
  render();
  // Обновление таймеров каждые 30 секунд
  setInterval(render, 30000);
}

function changeMaster() {
  const select = document.getElementById('masterSelect');
  currentMaster = select.value;
  const master = allMasters.find(m => String(m.id) === String(currentMaster));
  currentMasterName = master ? master.name : '';
  localStorage.setItem(MASTER_KEY, currentMaster);
  localStorage.setItem(MASTER_NAME_KEY, currentMasterName);
  render();
}

// ===== Firebase операции =====
function updateOrder(orderId, updates) { db.ref(`orders/${orderId}`).update(updates); }
function addOrder(order) { db.ref(`orders/${order.id}`).set(order); }
function updatePost(postId, updates) { db.ref(`posts/${postId}`).update(updates); }
function addToHistory(order) { db.ref(`history/${order.id}`).set(order); }
function removeFromQueue(orderId) { db.ref(`queue/${orderId}`).remove(); }

// ===== Рендер =====
function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}

function formatTime(ms) {
  const totalSec = Math.floor(Math.abs(ms) / 1000);
  const hours = Math.floor(totalSec / 3600);
  const mins = Math.floor((totalSec % 3600) / 60);
  const secs = totalSec % 60;
  if (hours > 0) return `${hours}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  return `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
}

function formatCountdown(deadlineTs) {
  const diff = deadlineTs - Date.now();
  const abs = Math.abs(diff);
  const hours = Math.floor(abs / 3600000);
  const mins = Math.floor((abs % 3600000) / 60000);
  if (diff < 0) {
    if (hours > 0) return `−${hours}ч ${mins}м`;
    return `−${mins}м`;
  }
  if (hours > 0) return `${hours}ч ${mins}м`;
  const secs = Math.floor((abs % 60000) / 1000);
  return `${mins}м ${String(secs).padStart(2,'0')}с`;
}

function getDeadlineClass(deadlineTs) {
  const diff = deadlineTs - Date.now();
  if (diff < 0) return 'err';
  if (diff < 30 * 60 * 1000) return 'warn';
  return 'ok';
}

function getStatusLabel(status) {
  const labels = { 'queue': 'В очереди', 'in-progress': 'В работе', 'completed': 'Завершён' };
  return labels[status] || status;
}

function render() {
  if (!currentMaster) {
    document.getElementById('content').innerHTML = `
      <div class="empty">
        <div class="empty-icon">👤</div>
        <div>Выберите мастера вверху страницы</div>
      </div>
    `;
    return;
  }
  
  // Мои заказы — где я мастер и статус in-progress
  const myOrders = allOrders.filter(o => o.master === currentMasterName && o.status === 'in-progress');
  // Завершённые — история
  const completed = allHistory.filter(h => h.master === currentMasterName || !h.master);
  
  document.getElementById('queueCount').textContent = allQueue.length;
  document.getElementById('mineCount').textContent = myOrders.length;
  document.getElementById('doneCount').textContent = completed.length;
  
  const content = document.getElementById('content');
  let items = [];
  
  if (currentTab === 'queue') items = allQueue;
  else if (currentTab === 'mine') items = myOrders;
  else if (currentTab === 'done') items = completed;
  
  if (!items.length) {
    const emptyText = currentTab === 'queue' ? 'Очередь пуста 🎉' : 
                      currentTab === 'mine' ? 'Нет заказов в работе' : 'Нет завершённых';
    content.innerHTML = `
      <div class="empty">
        <div class="empty-icon">${currentTab === 'queue' ? '📭' : '📋'}</div>
        <div>${emptyText}</div>
      </div>
    `;
    return;
  }
  
  content.innerHTML = items.map(o => {
    const status = currentTab === 'queue' ? 'queue' : (o.status || 'in-progress');
    const isRepair = o.postId === 0;
    const time = o.startedAt ? formatTime(Date.now() - o.startedAt) : (o.createdAt || '—');
    let deadlineHtml = '';
    if (o.deadline && status !== 'completed') {
      const cls = getDeadlineClass(o.deadline);
      const prefix = cls === 'err' ? '⚠ ' : '⏱ ';
      deadlineHtml = `<span class="deadline-badge ${cls}">${prefix}${formatCountdown(o.deadline)}</span>`;
    }
    
    const post = allPosts.find(p => p.id == o.postId);
    const postLabel = isRepair ? '🔧 Без подъёмника' : (post?.name || '—');
    
    return `
      <div class="order-card ${status} ${isRepair ? 'repair' : ''}" onclick="showDetails(${o.id})">
        <div class="order-header">
          <div>
            <div class="order-id">#${o.id} ${deadlineHtml}</div>
            <span class="badge ${status}">${getStatusLabel(status)}</span>
            ${isRepair ? '<span class="badge" style="background:rgba(6,182,212,0.2); color:var(--cyan); margin-left:4px;">Ремонтная зона</span>' : ''}
          </div>
          <div class="order-time">${time}</div>
        </div>
        <div class="order-main">
          <div class="order-car">${o.car}</div>
          <div class="order-client">${o.client} ${o.phone ? '· ' + o.phone : ''}</div>
          <div class="order-services">${o.services}</div>
          <div class="order-price-tag">${o.price} ₽</div>
        </div>
        ${currentTab === 'mine' ? `
          <div class="item-sub" style="margin-top:8px; color:var(--muted); font-size:12px;">📍 ${postLabel}</div>
        ` : ''}
        <div class="order-footer">
          ${currentTab === 'queue' ? `<button class="btn ok" onclick="event.stopPropagation(); openPostSelect(${o.id})">🤝 Взять заказ</button>` : ''}
          ${currentTab === 'mine' ? `<button class="btn ok" onclick="event.stopPropagation(); completeWork(${o.id})">✓ Завершить</button>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function showDetails(orderId) {
  const order = allQueue.find(o => o.id == orderId) || 
                allOrders.find(o => o.id == orderId) || 
                allHistory.find(h => h.id == orderId);
  if (!order) return;
  
  const post = allPosts.find(p => p.id == order.postId);
  const status = allQueue.find(o => o.id == orderId) ? 'queue' : (order.status || 'in-progress');
  const isRepair = order.postId === 0;
  
  document.getElementById('modalTitle').textContent = `Наряд #${order.id}`;
  document.getElementById('modalBody').innerHTML = `
    <div class="detail-row">
      <div class="detail-label">Статус</div>
      <div class="detail-value"><span class="badge ${status}">${getStatusLabel(status)}</span></div>
    </div>
    <div class="detail-row">
      <div class="detail-label">Клиент</div>
      <div class="detail-value">${order.client} ${order.phone ? '· ' + order.phone : ''}</div>
    </div>
    <div class="detail-row">
      <div class="detail-label">Автомобиль</div>
      <div class="detail-value">${order.car}</div>
    </div>
    <div class="detail-row">
      <div class="detail-label">Услуги</div>
      <div class="detail-value">${order.services}</div>
    </div>
    <div class="detail-row">
      <div class="detail-label">Место работы</div>
      <div class="detail-value">${isRepair ? '🔧 Ремонтная зона (без подъёмника)' : (post?.name || '—')}</div>
    </div>
    <div class="detail-row">
      <div class="detail-label">Мастер</div>
      <div class="detail-value">${order.master || 'Не назначен'}</div>
    </div>
    <div class="detail-row">
      <div class="detail-label">Стоимость</div>
      <div class="detail-value" style="color: var(--accent); font-weight: 700;">${order.price} ₽</div>
    </div>
    ${order.deadline ? `
      <div class="detail-row">
        <div class="detail-label">Выдать к</div>
        <div class="detail-value">${new Date(order.deadline).toLocaleString('ru-RU', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
      </div>
    ` : ''}
    ${order.startedAt ? `
      <div class="detail-row">
        <div class="detail-label">Время в работе</div>
        <div class="detail-value">${formatTime(Date.now() - order.startedAt)}</div>
      </div>
    ` : ''}
  `;
  
  let actions = `<button class="btn ghost" onclick="closeModal()">Закрыть</button>`;
  if (status === 'queue') {
    actions += `<button class="btn ok" onclick="openPostSelect(${order.id}); closeModal()">🤝 Взять заказ</button>`;
  } else if (status === 'in-progress') {
    actions += `<button class="btn ok" onclick="completeWork(${order.id}); closeModal()">✓ Завершить</button>`;
  }
  
  document.getElementById('modalActions').innerHTML = actions;
  document.getElementById('detailModal').classList.add('open');
}

function closeModal() {
  document.getElementById('detailModal').classList.remove('open');
}

// ===== Выбор подъёмника =====
function openPostSelect(orderId) {
  const order = allQueue.find(o => o.id == orderId);
  if (!order) return;
  
  pickingOrderId = orderId;
  selectedPostId = null;
  isRepairZone = false;
  
  document.getElementById('pickCar').textContent = order.car;
  document.getElementById('pickServices').textContent = order.services;
  
  // Собираем свободные подъёмники + опцию "без подъёмника"
  const freePosts = allPosts.filter(p => p.status === 'free');
  const busyPosts = allPosts.filter(p => p.status !== 'free');
  
  let html = '';
  
  // Опция "Ремонтная зона" (без подъёмника) - всегда доступна
  html += `
    <div class="post-option repair-zone" onclick="selectPostOption(0, true)">
      <div>
        <div class="post-option-name">🔧 Ремонтная зона</div>
        <div class="post-option-status" style="color:var(--cyan);">Без подъёмника · несколько мастеров</div>
      </div>
    </div>
  `;
  
  // Свободные подъёмники
  if (freePosts.length > 0) {
    html += '<div style="margin:12px 0 8px; font-size:12px; color:var(--muted); text-transform:uppercase;">Свободные подъёмники</div>';
    freePosts.forEach(p => {
      html += `
        <div class="post-option" onclick="selectPostOption(${p.id}, false)">
          <div>
            <div class="post-option-name">${p.name}</div>
            <div class="post-option-status free">● Свободен</div>
          </div>
        </div>
      `;
    });
  } else {
    html += '<div style="margin:12px 0 8px; font-size:12px; color:var(--warn);">⚠ Нет свободных подъёмников</div>';
  }
  
  // Занятые подъёмники (только для информации)
  if (busyPosts.length > 0) {
    html += '<div style="margin:12px 0 8px; font-size:12px; color:var(--muted); text-transform:uppercase;">Занятые</div>';
    busyPosts.forEach(p => {
      html += `
        <div class="post-option" style="opacity:0.5; cursor:not-allowed;" onclick="return false;">
          <div>
            <div class="post-option-name">${p.name}</div>
            <div class="post-option-status" style="color:var(--warn);">● Занят</div>
          </div>
        </div>
      `;
    });
  }
  
  document.getElementById('postOptions').innerHTML = html;
  document.getElementById('confirmPickBtn').disabled = true;
  document.getElementById('postSelectModal').classList.add('open');
}

function selectPostOption(postId, repair) {
  selectedPostId = postId;
  isRepairZone = repair;
  
  // Визуальное выделение
  document.querySelectorAll('.post-option').forEach(el => el.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  
  document.getElementById('confirmPickBtn').disabled = false;
}

function closePostSelect() {
  document.getElementById('postSelectModal').classList.remove('open');
  pickingOrderId = null;
  selectedPostId = null;
  isRepairZone = false;
}

function confirmPick() {
  if (!pickingOrderId || selectedPostId === null) return;
  
  const order = allQueue.find(o => o.id == pickingOrderId);
  if (!order) { closePostSelect(); return; }
  
  const master = allMasters.find(m => String(m.id) === String(currentMaster));
  const masterName = master ? master.name : currentMasterName;
  
  // Создаём заказ в active orders
  const newOrder = {
    ...order,
    postId: isRepairZone ? 0 : selectedPostId,
    master: masterName,
    masterId: String(currentMaster),
    startedAt: Date.now(),
    status: 'in-progress'
  };
  
  // Удаляем из очереди
  removeFromQueue(pickingOrderId);
  
  // Добавляем в активные заказы
  addOrder(newOrder);
  
  // Если выбран подъёмник — занимаем его
  if (!isRepairZone && selectedPostId) {
    updatePost(selectedPostId, { status: 'busy' });
  }
  
  closePostSelect();
}

function completeWork(orderId) {
  if (!confirm('Завершить работу?')) return;
  
  const order = allOrders.find(o => o.id == orderId);
  if (!order) return;
  
  const completedOrder = {
    ...order,
    status: 'completed',
    master: order.master || currentMasterName,
    masterId: order.masterId || String(currentMaster),
    finishedAt: new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})
  };
  
  addToHistory(completedOrder);
  db.ref(`orders/${orderId}`).remove();
  
  // Освобождаем подъёмник если он был
  if (order.postId && order.postId !== 0) {
    updatePost(order.postId, { status: 'free' });
  }
  
  // Обновляем статистику
  db.ref('stats').once('value', (snapshot) => {
    const data = snapshot.val() || { revenue: 0, servedToday: 0, dailyStats: {} };
    const today = new Date().toISOString().split('T')[0];
    
    data.revenue = (data.revenue || 0) + (order.price || 0);
    data.servedToday = (data.servedToday || 0) + 1;
    
    if (!data.dailyStats) data.dailyStats = {};
    if (!data.dailyStats[today]) data.dailyStats[today] = { revenue: 0, orders: 0, masters: {} };
    
    data.dailyStats[today].revenue += order.price || 0;
    data.dailyStats[today].orders += 1;
    
    const masterId = order.masterId || String(currentMaster) || 'unassigned';
    if (!data.dailyStats[today].masters[masterId]) data.dailyStats[today].masters[masterId] = 0;
    data.dailyStats[today].masters[masterId] += order.price || 0;
    
    db.ref('stats').set(data);
  });
}

init();
</script>
</body>
</html>
